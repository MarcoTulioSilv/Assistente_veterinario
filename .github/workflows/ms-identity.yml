name: MS1 Identity & Registry

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/ms-identity/**'
      - 'packages/**'
      - '.github/workflows/ms-identity.yml'
  pull_request:
    paths:
      - 'apps/ms-identity/**'
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-identity/prisma/schema.prisma
      - run: npm run lint --workspace=@vetequine/ms-identity
      - run: npm run typecheck --workspace=@vetequine/ms-identity

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vetequine
          POSTGRES_PASSWORD: vetequine
          POSTGRES_DB: identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_IDENTITY: postgresql://vetequine:vetequine@localhost:5432/identity_test
      JWT_SECRET: test-secret-com-mais-de-32-caracteres-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-identity/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/ms-identity/prisma/schema.prisma
      - run: npm run test:cov --workspace=@vetequine/ms-identity

  security:
    name: SAST & Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # BLOQUEIA o merge: vulnerabilidade que chega a producao
      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      # INFORMATIVO: ferramentas de build (nao bloqueia)
      - name: Audit completo
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ms-identity/Dockerfile
          push: false
          tags: vetequine/ms-identity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
