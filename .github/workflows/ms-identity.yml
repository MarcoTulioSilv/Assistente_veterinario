name: MS1 Identity & Registry

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/ms-identity/**'
      - 'packages/**'
      - '.github/workflows/ms-identity.yml'
  pull_request:
    paths:
      - 'apps/ms-identity/**'
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-identity/prisma/schema.prisma
      # turbo (nao "npm run --workspace") -- typecheck/lint dependem de shared-types
      # e shared-middlewares estarem buildados primeiro (turbo.json dependsOn: ["^build"]);
      # chamar o script do workspace direto pula essa ordem e falha com "Cannot find
      # module '@quironequine/shared-types'" (dist/ e gitignorado, nunca existe num checkout limpo).
      - run: npx turbo run lint --filter=@quironequine/ms-identity
      - run: npx turbo run typecheck --filter=@quironequine/ms-identity

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quironequine
          POSTGRES_PASSWORD: quironequine
          POSTGRES_DB: identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_IDENTITY: postgresql://quironequine:quironequine@localhost:5432/identity_test
      DATABASE_URL_IDENTITY_APP: postgresql://quironequine_app:app_dev_password@localhost:5432/identity_test
      JWT_SECRET: test-secret-com-mais-de-32-caracteres-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-identity/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/ms-identity/prisma/schema.prisma
      # Cria a role restrita (quironequine_app) e concede as permissoes pos-migration --
      # sem isso, os testes que usam DATABASE_URL_IDENTITY_APP (RLS, auth lookup)
      # nao tem role pra conectar (ADR-003 Decisao 1).
      - name: Criar role quironequine_app
        run: psql "$DATABASE_URL_IDENTITY" -f infra/postgres-init/01-create-app-role.sql
      # turbo, mesmo motivo do job lint: test:cov precisa de shared-types/
      # shared-middlewares buildados (dist/), senao falha em runtime (MODULE_NOT_FOUND),
      # nao so em typecheck.
      - run: npx turbo run test:cov --filter=@quironequine/ms-identity

  security:
    name: SAST & Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # BLOQUEIA o merge: vulnerabilidade que chega a producao
      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      # INFORMATIVO: ferramentas de build (nao bloqueia)
      - name: Audit completo
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Docker + smoke test
    runs-on: ubuntu-latest
    needs: [test, security]
    # Redis pro smoke test: o servico sobe workers do BullMQ no boot.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ms-identity/Dockerfile
          push: false
          # load: a imagem precisa ficar no daemon local pro smoke test rodar.
          load: true
          tags: quironequine/ms-identity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Buildar nao basta: as imagens antigas buildavam e morriam no boot com
      # MODULE_NOT_FOUND. O /health (liveness) nao toca no banco -- a URL so
      # precisa existir, porque o Prisma conecta no primeiro uso.
      - name: Smoke test -- a imagem sobe e responde /health
        run: |
          docker run -d --name smoke --network host \
            -e NODE_ENV=production \
            -e PORT_MS_IDENTITY=3001 \
            -e DATABASE_URL_IDENTITY_APP=postgresql://smoke:smoke@localhost:5432/smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=smoke-test-secret \
            quironequine/ms-identity:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then break; fi
            sleep 1
          done
          echo "A imagem nao respondeu /health -- logs do container:"
          docker logs smoke
          exit 1
