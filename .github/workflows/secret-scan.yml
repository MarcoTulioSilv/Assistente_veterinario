name: Secret scan

# Revisão de segurança da Sprint 8: nada impedia um segredo real (chave de
# API, token, senha de produção) de entrar no repositório. Roda em todo PR e
# push, sem filtro de caminho — um segredo pode cair em qualquer arquivo.
# Varre o HISTÓRICO inteiro: apagar o arquivo num commit seguinte não tira o
# segredo do git.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Imagem com versão fixa: atualizar de propósito, não por acidente.
      # Falsos positivos conhecidos ficam no .gitleaksignore (por commit e
      # linha, não por arquivo inteiro).
      - name: Varrer histórico
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore
