name: BFF Gateway

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/bff/**'
      - 'packages/**'
      - '.github/workflows/bff.yml'
  pull_request:
    paths:
      - 'apps/bff/**'
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # turbo (nao "npm run --workspace") -- lint/typecheck dependem de
      # shared-types/shared-middlewares buildados primeiro (turbo.json
      # dependsOn: ["^build"]); dist/ e gitignorado, nao existe em checkout limpo.
      - run: npx turbo run lint --filter=@quironequine/bff
      - run: npx turbo run typecheck --filter=@quironequine/bff

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # BFF nao tem banco/broker proprios -- so proxy HTTP. Ainda sem
      # testes (ver vitest.config.ts); passWithNoTests mantem o job verde.
      - run: npx turbo run test --filter=@quironequine/bff

  security:
    name: SAST & Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Usa audit-ci (nao `npm audit` cru): o braces (GHSA-vfj7-8cjw-p6xm)
      # nao tem fix upstream em nenhuma versao publicada -- ver .audit-ci.json
      # na raiz pro porque do allowlist. audit-ci falha em QUALQUER outra
      # vulnerabilidade high/critical nao listada la.
      - name: Audit de dependências de produção
        run: npx audit-ci --config .audit-ci.json

      # INFORMATIVO: ferramentas de build (nao bloqueia)
      - name: Audit completo
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Docker + smoke test
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bff/Dockerfile
          push: false
          load: true
          tags: quironequine/bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test -- a imagem sobe e responde /health
        run: |
          docker run -d --name smoke --network host \
            -e NODE_ENV=production \
            -e PORT_BFF=3000 \
            -e MS_IDENTITY_URL=http://localhost:3001 \
            -e MS_INVENTORY_URL=http://localhost:3002 \
            quironequine/bff:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then break; fi
            sleep 1
          done
          echo "A imagem nao respondeu /health -- logs do container:"
          docker logs smoke
          exit 1
