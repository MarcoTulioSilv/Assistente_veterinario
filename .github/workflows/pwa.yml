name: PWA Frontend

on:
  push:
    branches: [main, staging, develop]
    paths: ['apps/pwa/**', 'packages/**', '.github/workflows/pwa.yml']
  pull_request:
    paths: ['apps/pwa/**', 'packages/**']

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # turbo (nao "npm run --workspace") -- pwa depende de @vetequine/shared-types
      # buildado primeiro (dist/ e gitignorado), turbo.json ja resolve isso via
      # dependsOn: ["^build"]. Mesmo bug corrigido no ms-identity.yml.
      - run: npx turbo run lint --filter=@vetequine/pwa
      - run: npx turbo run typecheck --filter=@vetequine/pwa
      - run: npx turbo run build --filter=@vetequine/pwa
        env:
          NEXT_PUBLIC_BFF_URL: http://localhost:3000/api/v1
