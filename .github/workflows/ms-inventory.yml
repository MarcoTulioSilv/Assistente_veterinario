name: MS2 Inventory

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/ms-inventory/**'
      - 'packages/**'
      - '.github/workflows/ms-inventory.yml'
  pull_request:
    paths:
      - 'apps/ms-inventory/**'
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-inventory/prisma/schema.prisma
      # turbo (nao "npm run --workspace") -- typecheck/lint dependem de shared-types
      # e shared-middlewares estarem buildados primeiro (turbo.json dependsOn: ["^build"]);
      # chamar o script do workspace direto pula essa ordem e falha com "Cannot find
      # module '@quironequine/shared-types'" (dist/ e gitignorado, nunca existe num checkout limpo).
      - run: npx turbo run lint --filter=@quironequine/ms-inventory
      - run: npx turbo run typecheck --filter=@quironequine/ms-inventory

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quironequine
          POSTGRES_PASSWORD: quironequine
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      # DeductionService (RN-003) usa BullMQ/Redis de verdade no teste
      # de integração — sem isto, esse teste nunca roda em CI (os
      # testes unitários escapam disso via vi.mock em events/publisher).
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_INVENTORY: postgresql://quironequine:quironequine@localhost:5432/inventory_test
      DATABASE_URL_INVENTORY_APP: postgresql://quironequine_app:app_dev_password@localhost:5432/inventory_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-inventory/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/ms-inventory/prisma/schema.prisma
      # Cria a role restrita (quironequine_app) e concede as permissoes pos-migration --
      # sem isso, os testes que usam DATABASE_URL_INVENTORY_APP (RLS) nao tem role
      # pra conectar (mesmo padrao do ms-identity, ADR-003 Decisao 1).
      - name: Criar role quironequine_app
        run: psql "$DATABASE_URL_INVENTORY" -f infra/postgres-init/01-create-app-role.sql
      # turbo, mesmo motivo do job lint: test:cov precisa de shared-types/
      # shared-middlewares buildados (dist/), senao falha em runtime (MODULE_NOT_FOUND),
      # nao so em typecheck.
      - run: npx turbo run test:cov --filter=@quironequine/ms-inventory

  security:
    name: SAST & Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # BLOQUEIA o merge: vulnerabilidade que chega a producao.
      # Roda sem --workspace, entao audita o repo INTEIRO (monorepo com
      # lockfile unico) -- uma vulnerabilidade em qualquer servico (ex.:
      # apps/pwa) bloqueia o CI de qualquer outro (aqui, ms-inventory).
      #
      # PENDENTE (@joaolmpv): next 16.2.12 (apps/pwa) tem RCE critica
      # (GHSA-p293-qw3h-jr36, GHSA-2xp9-vwfh-vxw4). Tentei corrigir
      # nesta branch (bump de next + overrides de sharp/qs no
      # package.json raiz) e revertido tudo, por dois motivos:
      #   1. next >=16.3.3 quebra o build de producao:
      #      "Cannot read properties of null (reading 'useContext')"
      #      Export encountered an error on /_global-error/page
      #   2. os overrides de sharp/qs, mesmo isolados (sem mexer em
      #      next), se mostraram frágeis nesta instalação do npm --
      #      em vez de atualizar as versões, uma tentativa acabou
      #      REMOVENDO sharp/qs da árvore de dependências (`npm ls`
      #      passou a não encontrá-los) -- pior que a vulnerabilidade.
      # ACHADO NOVO, separado do audit: rodando `next build` local
      # mesmo com next@16.2.12 (a versão "boa" original, sem nenhuma
      # mudança de dependência), o build JÁ FALHA sozinho, em
      # /animals/new: "Cannot read properties of null (reading
      # 'useState')" durante o prerender -- parece pré-existente
      # nesta branch/develop, não relacionado ao audit. Vale conferir
      # se `apps/pwa`'s CI (pwa.yml) está passando de verdade.
      # Fora do escopo desta PR (backend/DeductionService) mexer no
      # app do PWA sem revisão -- ver comentário no PR #16.
      # Usa audit-ci (nao `npm audit` cru): o braces (GHSA-vfj7-8cjw-p6xm)
      # nao tem fix upstream em nenhuma versao publicada -- ver .audit-ci.json
      # na raiz pro porque do allowlist. audit-ci falha em QUALQUER outra
      # vulnerabilidade high/critical nao listada la.
      - name: Audit de dependências de produção
        run: npx audit-ci --config .audit-ci.json

      # INFORMATIVO: ferramentas de build (nao bloqueia)
      - name: Audit completo
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Docker + smoke test
    runs-on: ubuntu-latest
    needs: [test, security]
    # Redis pro smoke test: o servico sobe workers do BullMQ no boot.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ms-inventory/Dockerfile
          push: false
          # load: a imagem precisa ficar no daemon local pro smoke test rodar.
          load: true
          tags: quironequine/ms-inventory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Buildar nao basta: as imagens antigas buildavam e morriam no boot com
      # MODULE_NOT_FOUND. O /health (liveness) nao toca no banco -- a URL so
      # precisa existir, porque o Prisma conecta no primeiro uso.
      - name: Smoke test -- a imagem sobe e responde /health
        run: |
          docker run -d --name smoke --network host \
            -e NODE_ENV=production \
            -e PORT_MS_INVENTORY=3002 \
            -e DATABASE_URL_INVENTORY_APP=postgresql://smoke:smoke@localhost:5432/smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=smoke-test-secret \
            quironequine/ms-inventory:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3002/health; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then break; fi
            sleep 1
          done
          echo "A imagem nao respondeu /health -- logs do container:"
          docker logs smoke
          exit 1
