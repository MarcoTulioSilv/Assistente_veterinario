name: MS2 Inventory

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/ms-inventory/**'
      - 'packages/**'
      - '.github/workflows/ms-inventory.yml'
  pull_request:
    paths:
      - 'apps/ms-inventory/**'
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-inventory/prisma/schema.prisma
      # turbo (nao "npm run --workspace") -- typecheck/lint dependem de shared-types
      # e shared-middlewares estarem buildados primeiro (turbo.json dependsOn: ["^build"]);
      # chamar o script do workspace direto pula essa ordem e falha com "Cannot find
      # module '@vetequine/shared-types'" (dist/ e gitignorado, nunca existe num checkout limpo).
      - run: npx turbo run lint --filter=@vetequine/ms-inventory
      - run: npx turbo run typecheck --filter=@vetequine/ms-inventory

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vetequine
          POSTGRES_PASSWORD: vetequine
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      # DeductionService (RN-003) usa BullMQ/Redis de verdade no teste
      # de integração — sem isto, esse teste nunca roda em CI (os
      # testes unitários escapam disso via vi.mock em events/publisher).
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_INVENTORY: postgresql://vetequine:vetequine@localhost:5432/inventory_test
      DATABASE_URL_INVENTORY_APP: postgresql://vetequine_app:app_dev_password@localhost:5432/inventory_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/ms-inventory/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/ms-inventory/prisma/schema.prisma
      # Cria a role restrita (vetequine_app) e concede as permissoes pos-migration --
      # sem isso, os testes que usam DATABASE_URL_INVENTORY_APP (RLS) nao tem role
      # pra conectar (mesmo padrao do ms-identity, ADR-003 Decisao 1).
      - name: Criar role vetequine_app
        run: psql "$DATABASE_URL_INVENTORY" -f infra/postgres-init/01-create-app-role.sql
      # turbo, mesmo motivo do job lint: test:cov precisa de shared-types/
      # shared-middlewares buildados (dist/), senao falha em runtime (MODULE_NOT_FOUND),
      # nao so em typecheck.
      - run: npx turbo run test:cov --filter=@vetequine/ms-inventory

  security:
    name: SAST & Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # BLOQUEIA o merge: vulnerabilidade que chega a producao
      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      # INFORMATIVO: ferramentas de build (nao bloqueia)
      - name: Audit completo
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ms-inventory/Dockerfile
          push: false
          tags: vetequine/ms-inventory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
